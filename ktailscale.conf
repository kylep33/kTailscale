# kTailscale: turn Tailscale on at boot, unless "Turn on Tailscale by default" is off in the app.
# install.sh fills in @PKG@ and copies this to /etc/upstart/.
start on started lab126_gui

script
    [ -e /mnt/us/extensions/tailscale/bin/no-autostart ] && exit 0
    sh @PKG@/ctl.sh boot >/dev/null 2>&1 &
end script
